<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>⚠️ КРАФТМИР | КРИТИЧЕСКАЯ ОШИБКА</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body {
            background: #1a1a2e;
            color: #eee;
            font-family: 'Press Start 2P', cursive; /* Пиксельный шрифт */
            margin: 0;
            overflow: hidden;
            text-align: center;
        }
        
        #game-screen {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e);
        }
        
        .glitch {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            color: #ff0066;
            text-shadow: 2px 2px #00ffff;
            animation: glitch 1s infinite;
        }
        
        @keyframes glitch {
            0%, 100% { transform: translateX(-50%) skew(0deg); }
            25% { transform: translateX(-50%) skew(2deg); }
            75% { transform: translateX(-50%) skew(-2deg); }
        }
        
        .inventory {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            opacity: 0.3; /* Заблокировано */
            filter: grayscale(100%);
        }
        
        .item {
            width: 60px;
            height: 60px;
            border: 3px solid #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            background: #000;
        }
        
        .locked::after {
            content: "🔒";
            position: absolute;
            font-size: 20px;
        }
        
        #console-hint {
            position: absolute;
            bottom: 20px;
            width: 100%;
            color: #00ff00;
            font-size: 10px;
            animation: blink 2s infinite;
        }
        
        @keyframes blink { 0%, 100% {opacity:1} 50% {opacity:0} }
        
        .success-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,255,0,0.2);
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div id="game-screen">
        <div class="glitch">⚠️ СИСТЕМА ВЗЛОМАНА ⚠️</div>
        <div style="margin-top: 150px; color: #666; font-size: 12px;">
            > Потеряно связь с базой данных<br>
            > Инвентарь заблокирован<br>
            > Требуется доступ разработчика
        </div>
        
        <div class="inventory locked" id="inv">
            <div class="item">💎</div>
            <div class="item">⚔️</div>
            <div class="item">🛡️</div>
            <div class="item">👑</div>
        </div>
        
        <div id="console-hint">
            [F12] Открыть панель разработчика → Console → Введи: dev_mode()
        </div>
    </div>
    
    <div class="success-overlay" id="win">
        <div style="margin-top: 20%; color: #0f0; font-size: 30px;">
            ✅ ДОСТУП ПОЛУЧЕН!<br>
            <span style="font-size: 12px; color: #fff;">Загрузка следующего уровня...</span>
        </div>
    </div>

    <script>
        // Эффект "падающих блоков" на фоне
        const chars = "▓▒░█▄▀■□";
        setInterval(() => {
            const el = document.createElement('div');
            el.style.position = 'fixed';
            el.style.left = Math.random() * 100 + '%';
            el.style.top = '-20px';
            el.style.color = 'rgba(0,255,0,0.1)';
            el.style.fontSize = '20px';
            el.style.fontFamily = 'monospace';
            el.innerText = chars[Math.floor(Math.random() * chars.length)];
            el.style.animation = 'fall 3s linear';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 3000);
        }, 100);
        
        // CSS для анимации падения
        const style = document.createElement('style');
        style.innerHTML = `@keyframes fall { to { transform: translateY(100vh); } }`;
        document.head.appendChild(style);

        // ГЛАВНАЯ ФУНКЦИЯ ДЛЯ КОНСОЛИ
        window.dev_mode = function() {
            console.log("%c🔓 РЕЖИМ РАЗРАБОТЧИКА АКТИВИРОВАН", "color: #00ff00; font-size: 20px; font-weight: bold;");
            console.log("%cТы теперь из команды создателей игры!", "color: cyan;");
            
            // Визуальная магия на странице
            const inv = document.getElementById('inv');
            inv.style.opacity = '1';
            inv.style.filter = 'none';
            inv.style.transition = 'all 1s';
            inv.style.transform = 'translateX(-50%) scale(1.2)';
            
            document.querySelector('.glitch').innerHTML = "✅ СИСТЕМА ВОССТАНОВЛЕНА";
            document.querySelector('.glitch').style.color = "#00ff00";
            
            setTimeout(() => {
                document.getElementById('win').style.display = 'block';
                console.log("Следующая миссия: bit.ly/kraft2");
            }, 2000);
            
            return "Добро пожаловать в команду разработчиков! Твой код: DEV-2024";
        };
        
        // Пасхалка для тех, кто откроет консоль раньше времени
        console.log("%c🎮 СЕКРЕТНАЯ ИНФОРМАЦИЯ", "color: yellow; font-size: 16px; border: 2px solid yellow; padding: 5px;");
        console.log("Главный_Баг оставил следы...");
        console.log("Попробуй найти команду dev_mode()");
    </script>
</body>
</html>
